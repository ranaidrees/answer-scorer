[project]
name = "answer-scorer"
version = "0.1.0"
description = "AI answer scorer with a trust harness. Reference implementation, synthetic data only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.26.0",
    "azure-monitor-opentelemetry>=1.8.11",
    "fastapi>=0.143.0",
    # Imported by opentelemetry-instrumentation-openai-v2, which does not declare it.
    # The openai package itself uses httpx2.
    "httpx>=0.28.1",
    "openai>=3.29.0",
    "opentelemetry-instrumentation-openai-v2>=2.4b0",
    # Pinned to the release made alongside the instrumentation above: later releases
    # dropped a module that it imports.
    "opentelemetry-util-genai==0.4b0",
    "pydantic>=2",
    "pyyaml>=6.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "poethepoet>=0.34",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scorer"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude/worktrees", ".azure"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Line length is the formatter's job; long string literals are left alone.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
norecursedirs = [".claude/worktrees", ".venv", ".azure"]
addopts = "-q"

[tool.poe.tasks.check]
help = "Lint, format check and all tests (including hook tests). Healthy output ends with 'passed'."
sequence = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
    { cmd = "pytest" },
]

[tool.poe.tasks.test]
help = "Run the test suite."
cmd = "pytest"

[tool.poe.tasks.eval]
help = "Run the offline eval suite against the live model deployment."
cmd = "python -c \"print('not yet implemented')\""

[tool.poe.tasks.run]
help = "Run the API and demo page on http://localhost:8000, with settings from .env.local."
cmd = "uvicorn scorer.api:app --host 127.0.0.1 --port 8000"
envfile = ".env.local"

[tool.poe.tasks.smoke]
help = "Start the app locally, score a strong, a weak and an injection answer, then stop it."
cmd = "python scripts/smoke.py --local"
envfile = ".env.local"

[tool.poe.tasks.smoke-remote]
help = "Smoke test against the live URL (--base-url, or CONTAINER_APP_FQDN from the environment)."
cmd = "python scripts/smoke.py --remote"
envfile = ".env.local"
